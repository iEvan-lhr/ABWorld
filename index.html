<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>北魏洛阳城 · 漫游</title><style>
*{box-sizing:border-box}html,body,canvas{width:100%;height:100%;margin:0;overflow:hidden}body{color:#283a31;background:#d8dfd7;font:14px Inter,'Microsoft YaHei',sans-serif}canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas.mouse-locked{cursor:none}header,aside,#status,#pad{position:absolute}header{top:16px;left:16px;display:flex;align-items:center;gap:16px;border:1px solid #b2b09e;background:#f6f2e9f4;border-radius:4px;padding:5px 6px 5px 15px;box-shadow:0 2px 10px #3332}h1{font:600 21px SimSun,serif;margin:0}nav{display:flex;gap:2px}button{background:transparent;border:0;color:inherit;cursor:pointer;font:inherit;padding:7px 10px;border-radius:3px}button[aria-pressed=true]{color:white;background:#384c40}button:focus-visible{outline:2px solid #a26643}aside{left:16px;bottom:16px;background:#f5f1e7e8;padding:6px 10px;border-radius:3px;font-size:12px;pointer-events:none}#status{top:68px;left:16px;background:#f6f2e9e8;border-radius:3px;padding:5px 10px;font-size:12px}#pad{display:none}@media(pointer:coarse){#pad{display:flex;right:10px;bottom:12px;gap:3px;background:#f5f1e7df;border-radius:4px}#pad button{touch-action:none;min-width:38px}aside{display:none}}@media(max-width:540px){header{left:8px;top:8px;gap:9px}h1{font-size:18px}button{font-size:12px}}
.speed{border-left:1px solid #bdbbab;padding-left:12px;display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}.speed input{width:98px;accent-color:#465e4e}.speed output{font-variant-numeric:tabular-nums;min-width:65px}@media(max-width:620px){header{max-width:calc(100% - 16px);flex-wrap:wrap;gap:6px}.speed{padding-left:0;border:0}.speed input{width:72px}} </style></head><body><canvas aria-label="北魏洛阳城，可步行及转头"></canvas><header><h1>北魏洛阳城</h1><nav aria-label="视角"><button id="first" aria-pressed="true">第一人称</button><button id="third" aria-pressed="false">漫游视角</button></nav><label class="speed" for="speed">步速 <input type="range" id="speed" min="0.5" max="6" step="0.1" value="1.6"><output id="speedValue" for="speed">1.6 米/秒</output></label></header><aside>WASD 移动　·　Shift 跑步　·　<span id="lookHint">点击街景，自由转头</span>　·　V 切换视角</aside><span id="status" role="status">正在载入街区…</span><div id="pad"><button data-key="KeyA" aria-label="左移">←</button><button data-key="KeyW" aria-label="前进">↑</button><button data-key="KeyS" aria-label="后退">↓</button><button data-key="KeyD" aria-label="右移">→</button></div><script>/*BUNDLE*/</script></body></html>
