name: abworld
services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: abworld-api:local
    restart: unless-stopped
    init: true
    environment:
      ABWORLD_API_ADDR: 0.0.0.0:8787
      ABWORLD_ROOT: /app
      ABWORLD_DATA_DIR: /app/.world
      ABWORLD_FRONT_SECRET: container-proxy-disabled
    volumes:
      - world-data:/app/.world
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: abworld-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ABWORLD_HTTP_PORT:-80}:80"
    volumes:
      - ${ABWORLD_ACME_ROOT:-./.acme}:/var/www/acme:ro
volumes:
  world-data:
